# @claude in issues and pull requests.
#
# The Claude GitHub App is already installed on GrumbleHQ (all repositories),
# so the only thing standing between this file and a working @claude is the
# ANTHROPIC_API_KEY secret. Until that exists this workflow fails on the
# authentication step -- which is why it arrives as a pull request rather than
# straight onto main.
#
# Add the secret once, at the org level, and every GrumbleHQ repo can use it:
#   gh secret set ANTHROPIC_API_KEY --org GrumbleHQ --visibility all
# (needs `gh auth refresh -h github.com -s admin:org` first)
#
# Note: this repo is public, so anyone can comment. The action itself checks
# that the commenting user has write access before Claude does anything.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
